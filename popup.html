<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AskJobs Consultant Autofill</title>
    <style>
      body {
        width: 240px;
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 14px;
        background: #111827;
        color: #fff;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .status {
        font-size: 12px;
        margin-bottom: 12px;
        padding: 8px;
        border-radius: 8px;
      }
      .status.connected {
        background: #14532d;
        color: #bbf7d0;
      }
      .status.disconnected {
        background: #7f1d1d;
        color: #fecaca;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
      }
      #fill-btn {
        background: #c02c2a;
        color: #fff;
      }
      #enable-site-btn {
        background: #1d4ed8;
        color: #fff;
      }
      #options-btn {
        background: #374151;
        color: #fff;
      }
      .hidden {
        display: none;
      }
      .hint {
        font-size: 11px;
        color: #9ca3af;
        margin: -4px 0 10px;
      }
      .divider {
        border: none;
        border-top: 1px solid #27272a;
        margin: 10px 0;
      }
      select {
        width: 100%;
        padding: 7px;
        border-radius: 8px;
        border: 1px solid #3f3f46;
        background: #18181b;
        color: #fff;
        font-size: 12px;
        margin-bottom: 6px;
      }
      #manual-candidate-btn {
        background: #374151;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>AskJobs Consultant Autofill</h1>
    <div id="status" class="status">Checking…</div>
    <button id="fill-btn" class="hidden">Fill this application</button>
    <button id="enable-site-btn" class="hidden">Enable on this site</button>
    <div id="enable-hint" class="hint hidden">
      Not one of the built-in sites — click above to allow AskJobs Consultant Autofill on this specific page only.
    </div>

    <div id="manual-candidate-section" class="hidden">
      <hr class="divider" />
      <div class="hint" style="margin-top: 0">
        Opened this job outside the Consultant app's Apply flow? Pick a candidate to fill for:
      </div>
      <select id="candidate-select">
        <option value="">Loading candidates…</option>
      </select>
      <select id="resume-version-select" class="hidden">
        <option value="">Loading resumes…</option>
      </select>
      <button id="manual-candidate-btn" disabled>Fill for this candidate</button>
    </div>

    <button id="options-btn">Settings</button>
    <script src="popup.js"></script>
  </body>
</html>
